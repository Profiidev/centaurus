[package]
name = "centaurus-macro-utils"
version = "0.1.3"
edition = "2024"
description = "Macro utilities for the centaurus"
readme = "README.md"
repository = "https://github.com/Profiidev/centaurus"
license = "MIT OR Apache-2.0"
keywords = []
categories = []
exclude = ["CHANGELOG.md"]

[dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.3", features = ["full"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }

[dev-dependencies]
quote = "=1.0.47"
