[package]
name = "centaurus"
version = "0.17.2"
edition = "2024"
description = "A utility library for various use cases."
readme = "README.md"
repository = "https://github.com/Profiidev/centaurus"
license = "MIT OR Apache-2.0"
keywords = []
categories = []
exclude = ["CHANGELOG.md"]

[lib]
path = "src/lib.rs"

[dependencies]
addr = { version = "0.15.6", optional = true }
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-extra",
  "axum-extra-cookie",
  "axum-extra-headers",
  "axum-json",
  "axum-query",
  "axum-tokio",
  "axum-ws",
  "macros",
  "swagger",
], optional = true }
argon2 = { version = "0.6.0", optional = true }
async-trait = { version = "0.1.91", optional = true }
axum = { version = "0.8.9", features = ["macros", "multipart", "tracing", "ws"], optional = true }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"], optional = true }
base64 = { version = "0.23.0", optional = true }
bollard = { version = "0.21.0", default-features = false, optional = true }
centaurus-derive = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
color-eyre = { version = "0.6.5", optional = true }
dashmap = { version = "6.2.1", optional = true }
eyre = { version = "0.6.12", optional = true }
futures-util = { version = "0.3.33", optional = true }
governor = { version = "0.10.4", optional = true }
hmac = { version = "0.13.0", optional = true }
http = { version = "1.5.0", optional = true }
hyper-util = { version = "0.1.20", features = ["client-legacy"], optional = true }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
], optional = true }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"], optional = true }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"], optional = true }
kube = { version = "4.2.0", features = ["derive", "runtime"], optional = true }
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "ring",
  "rustls",
  "rustls-native-certs",
  "smtp-transport",
  "tokio1-rustls",
], optional = true }
md5 = { version = "0.8.1", optional = true }
metrics = { version = "0.24.6", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, optional = true }
rand = { version = "0.10.2", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "form",
  "http2",
  "json",
  "system-proxy",
], optional = true }
rsa = { version = "0.9.10", optional = true }
schemars = { version = "1.2.2", optional = true }
sea-orm = { version = "2.0.1", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
], optional = true }
sea-orm-migration = { version = "2.0.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
serde-xml-rs = { version = "0.8.2", optional = true }
thiserror = { version = "2.0.19", optional = true }
time = { version = "0.3.55", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tower = { version = "0.5.3", optional = true }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum",
], optional = true }
tower-http = { version = "0.7.0", features = ["cors", "trace"], optional = true }
tower-service = { version = "0.3.3", optional = true }
tracing = { version = "0.1.44", features = ["std"], optional = true }
tracing-error = { version = "0.2.1", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.24.0", features = ["v4", "v7"], optional = true }
webauthn-rs-core = { version = "0.5.5", default-features = false, optional = true }
aws-config = { version = "1.10.1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "default-https-client",
], optional = true }
tokio-util = { version = "0.7.19", features = ["io"], optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"

[features]
default = ["avatar", "endpoints", "logging", "frontend", "metrics", "storage"]

db = [
  "chrono",
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "dep:tracing",
  "error",
  "serde",
  "serde_json",
  "uuid",
  "uuid/v4",
]

auth = [
  "argon2",
  "base64",
  "dep:time",
  "jsonwebtoken",
  "reqwest",
  "rsa",
  "url/serde",
  "centaurus-derive/auth",
  "sha2",
]
backend = [
  "dep:addr",
  "dep:async-trait",
  "dep:axum",
  "dep:axum-extra",
  "dep:dashmap",
  "dep:governor",
  "dep:tower",
  "dep:tower_governor",
  "dep:tower-http",
  "dep:tower-service",
  "dep:tracing",
  "dep:url",
  "error",
  "http",
  "serde",
  "serde_json",
  "tokio",
]
endpoints = [
  "auth",
  "backend",
  "config_site",
  "db",
  "dep:futures-util",
  "dep:rand",
  "mail",
  "openapi",
]
openapi = ["backend", "dep:aide", "dep:schemars", "schemars/url2", "schemars/uuid1"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "centaurus-derive/metrics"]

test = ["centaurus-derive/test"]

avatar = ["base64", "db", "gravatar", "image", "reqwest"]
logging = ["dep:color-eyre", "dep:tracing", "dep:tracing-error", "dep:tracing-subscriber", "serde"]
mail = ["dep:lettre", "error", "serde", "tokio", "centaurus-derive/mail"]
storage = [
  "dep:aws-config",
  "dep:aws-sdk-s3",
  "logging",
  "serde",
  "dep:tokio",
  "error",
  "http",
  "dep:tokio-util",
  "dep:axum",
]

config_site = ["centaurus-derive/site", "url"]
error = ["dep:eyre"]
frontend = ["proxy"]
gravatar = ["dep:md5"]
http3 = ["reqwest/http3"]
proxy = ["backend", "dep:hyper-util"]
req_xml = ["dep:thiserror", "serde_xml"]
tokio = ["dep:tokio"]
fix-migrations = []

argon2 = ["dep:argon2"]
base64 = ["dep:base64"]
chrono = ["dep:chrono"]
docker = ["dep:bollard"]
hmac = ["dep:hmac"]
http = ["dep:http"]
image = ["dep:image"]
jsonwebtoken = ["dep:jsonwebtoken"]
k8s = ["dep:k8s-openapi", "dep:kube"]
reqwest = ["dep:reqwest"]
rsa = ["dep:rsa"]
# separate features for error impl
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
serde_xml = ["dep:serde-xml-rs"]
url = ["dep:url"]
uuid = ["dep:uuid"]
webauthn = ["dep:webauthn-rs-core"]
sha2 = ["dep:sha2"]
