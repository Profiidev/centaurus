[package]
name = "centaurus-derive"
version = "0.1.7"
edition = "2024"
description = "A utility library for various use cases."
readme = "README.md"
repository = "https://github.com/Profiidev/centaurus"
license = "MIT OR Apache-2.0"
keywords = []
categories = []
exclude = ["CHANGELOG.md"]

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
centaurus-macro-utils = { workspace = true }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

[features]
metrics = []
site = []
auth = []
mail = []
test = []
