name: Feature Check
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        feature:
          - mail
          - logging
          - backend
          - db
          - auth
          - error
          - storage
          - backend,auth
          - backend,db,auth
          - backend,db,auth,frontend
          - endpoints
          - endpoints,storage
          - endpoints,metrics
          - endpoints,metrics,frontend
          - endpoints,frontend
          - endpoints,frontend,avatar
          - endpoints,frontend,avatar,storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt,clippy

      - name: Sanitize cache key
        id: sanitize
        run: |
          CLEAN_FEATURE=$(echo "${{ matrix.feature }}" | tr ',' '-')
          echo "clean_feature=$CLEAN_FEATURE" >> $GITHUB_OUTPUT

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: "linter_cache-${{ steps.sanitize.outputs.clean_feature }}"

      - name: Run Clippy
        run: cargo clippy --features "${{ matrix.feature }}" --no-default-features -- -D warnings
